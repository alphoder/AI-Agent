services:
  # AI Service — FastAPI relay for Gemini Live (voice) + Gemini Flash (vision/scoring)
  - type: web
    name: speakcoach-ai
    runtime: python
    pythonVersion: "3.11"
    rootDir: apps/ai-service
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health/ready
    envVars:
      - key: PORT
        value: 8000
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_PROMPT_API_KEY   # KEY 2 — Bixy + prompt-improve
        sync: false
      - key: API_GATEWAY_URL
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: WS_TICKET_SECRET        # MUST equal speakcoach-api's value
        sync: false
      - key: CORS_ORIGINS            # Vercel web origin(s), comma-separated
        sync: false

  # API Gateway — Express: Google auth, scenarios, sessions, scoring callbacks
  - type: web
    name: speakcoach-api
    runtime: node
    nodeVersion: "20"
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    plan: free
    healthCheckPath: /health
    dependencies:
      - speakcoach-ai
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: WS_TICKET_SECRET        # MUST equal speakcoach-ai's value
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # Frontend (Next.js) is deployed separately on Vercel. Required env there:
  #   NEXT_PUBLIC_API_URL=https://speakcoach-api.onrender.com/api
  #   NEXT_PUBLIC_GOOGLE_CLIENT_ID=<google oauth client id>
