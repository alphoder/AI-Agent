apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-service-secrets
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ai-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: avatar-platform/production
        property: OPENAI_API_KEY
    - secretKey: DEEPGRAM_API_KEY
      remoteRef:
        key: avatar-platform/production
        property: DEEPGRAM_API_KEY
    - secretKey: SIMLI_API_KEY
      remoteRef:
        key: avatar-platform/production
        property: SIMLI_API_KEY
    - secretKey: HEYGEN_API_KEY
      remoteRef:
        key: avatar-platform/production
        property: HEYGEN_API_KEY
    - secretKey: PINECONE_API_KEY
      remoteRef:
        key: avatar-platform/production
        property: PINECONE_API_KEY
    - secretKey: REDIS_URL
      remoteRef:
        key: avatar-platform/production
        property: REDIS_URL
    - secretKey: LIVEKIT_API_KEY
      remoteRef:
        key: avatar-platform/production
        property: LIVEKIT_API_KEY
    - secretKey: LIVEKIT_API_SECRET
      remoteRef:
        key: avatar-platform/production
        property: LIVEKIT_API_SECRET
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: avatar-platform/production
        property: S3_ACCESS_KEY
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: avatar-platform/production
        property: S3_SECRET_KEY
