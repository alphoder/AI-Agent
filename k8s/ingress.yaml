apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: avatar-platform-ingress
  namespace: frontend
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
    - hosts:
        - app.avatar-platform.com
        - api.avatar-platform.com
      secretName: avatar-platform-tls
  rules:
    - host: app.avatar-platform.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
    - host: api.avatar-platform.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-external
                port:
                  number: 80
---
# ExternalName service to bridge the api service from the api namespace
# into the frontend namespace where the Ingress lives.
apiVersion: v1
kind: Service
metadata:
  name: api-external
  namespace: frontend
spec:
  type: ExternalName
  externalName: api.api.svc.cluster.local
