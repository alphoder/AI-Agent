name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (git SHA) to deploy'
        required: true
        type: string
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        type: string

jobs:
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deployment
        if: ${{ github.event.inputs.confirm != 'deploy' }}
        run: |
          echo "Deployment not confirmed. Type 'deploy' to confirm."
          exit 1

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: aws eks update-kubeconfig --name avatar-production --region ${{ secrets.AWS_REGION }}

      - name: Update image tags in manifests
        run: |
          sed -i "s|IMAGE_TAG|${{ github.event.inputs.image_tag }}|g" k8s/frontend/*.yaml k8s/api/*.yaml k8s/ai/*.yaml

      - name: Apply Kubernetes manifests (blue-green rolling update)
        run: |
          kubectl apply -f k8s/namespaces.yaml
          kubectl apply -f k8s/frontend/ --recursive
          kubectl apply -f k8s/api/ --recursive
          kubectl apply -f k8s/ai/ --recursive
          kubectl apply -f k8s/ingress.yaml

      - name: Wait for rollout with auto-rollback
        run: |
          set +e
          kubectl rollout status deployment/web -n frontend --timeout=300s
          WEB_STATUS=$?
          kubectl rollout status deployment/api -n api --timeout=300s
          API_STATUS=$?
          kubectl rollout status deployment/ai-service -n ai --timeout=300s
          AI_STATUS=$?

          if [ $WEB_STATUS -ne 0 ] || [ $API_STATUS -ne 0 ] || [ $AI_STATUS -ne 0 ]; then
            echo "Deployment failed! Rolling back..."
            kubectl rollout undo deployment/web -n frontend
            kubectl rollout undo deployment/api -n api
            kubectl rollout undo deployment/ai-service -n ai
            exit 1
          fi

      - name: Health check verification
        run: |
          sleep 30
          API_URL=$(kubectl get ingress -n api -o jsonpath='{.items[0].spec.rules[0].host}')
          for i in {1..10}; do
            if curl -sf "https://${API_URL}/health"; then
              echo "Health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed! Rolling back..."
          kubectl rollout undo deployment/web -n frontend
          kubectl rollout undo deployment/api -n api
          kubectl rollout undo deployment/ai-service -n ai
          exit 1
